<title>Black Friday Copafer · Copafer × 75 LAB</title>
<meta name="description" content="Kit de materiais de PDV para a Black Friday das lojas Copafer de Santo André e Mauá · 75 LAB">
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Black Friday Copafer · template "sinalização de obra"
   Uma página de rolagem com 6 telas cheias. Linguagem de placa e etiqueta de preço:
   preto, amarelo de sinalização, fita zebrada e tipografia condensada (Barlow, desenhada a partir de placas de estrada). */
:root{
  --ink:#0F0F0E;
  --ink2:#1B1A17;
  --yel:#F5B800;
  --paper:#F1EEE6;
  --white:#FBFAF6;
  --mut-d:#A9A499;
  --mut-l:#5F5A50;
  --f-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-b:"Barlow",Arial,sans-serif;
  --px:clamp(20px,5.5vw,96px);
  --bar:60px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ui:var(--white);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--white);font:400 16px/1.45 var(--f-b);-webkit-font-smoothing:antialiased}
body[data-tone="yel"],body[data-tone="paper"]{--ui:var(--ink)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--yel);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- telas e tons ---------- */
.s{--bg:var(--ink);--fg:var(--white);--mut:var(--mut-d);--line:rgba(255,255,255,.14);--acc:var(--yel);
  position:relative;min-height:100vh;min-height:100svh;padding:calc(var(--bar) + clamp(14px,3.2vh,36px)) var(--px) clamp(28px,5vh,56px);
  background:var(--bg);color:var(--fg);display:flex;flex-direction:column;gap:clamp(16px,3vh,32px);overflow:hidden;scroll-snap-align:start}
.s.t-yel{--bg:var(--yel);--fg:var(--ink);--mut:#4A3B00;--line:rgba(15,15,14,.2);--acc:var(--ink)}
.s.t-paper{--bg:var(--paper);--fg:var(--ink);--mut:var(--mut-l);--line:rgba(15,15,14,.14);--acc:#8A5E00}
@media (min-width:900px) and (min-height:640px){html{scroll-snap-type:y proximity}}

/* ---------- barra fixa e índice ---------- */
.bar{position:fixed;z-index:20;top:0;left:0;right:0;height:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 var(--px);color:var(--ui);pointer-events:none;transition:color .4s}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;font:800 22px/1 var(--f-d);letter-spacing:.07em;text-transform:uppercase;text-decoration:none}
.brand .x{font-weight:500;opacity:.45}
.brand img{height:17px;width:auto}
.brand .lab-b{display:none}
body[data-tone="yel"] .brand .lab-w,body[data-tone="paper"] .brand .lab-w{display:none}
body[data-tone="yel"] .brand .lab-b,body[data-tone="paper"] .brand .lab-b{display:block}
.count{font:600 13px/1 var(--f-b);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.count b{font-weight:800}
.dots{position:fixed;z-index:20;right:clamp(10px,1.4vw,24px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;color:var(--ui);transition:color .4s}
.dots li{display:flex;justify-content:flex-end}
.dots button{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-height:22px}
.dots i{width:8px;height:8px;border-radius:4px;background:currentColor;opacity:.35;transition:height .3s var(--ease),opacity .3s}
.dots span{font:700 11px/1 var(--f-b);letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateX(6px);transition:opacity .25s,transform .25s;white-space:nowrap}
.dots button:hover span,.dots button:focus-visible span{opacity:1;transform:none}
.dots button[aria-current="true"] i{opacity:1;height:22px}

/* ---------- tipografia ---------- */
.eyebrow{font:700 12px/1.2 var(--f-b);letter-spacing:.18em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:3px;background:currentColor;flex:none}
.h2{font:800 clamp(40px,5.2vw,86px)/.9 var(--f-d);text-transform:uppercase;letter-spacing:-.005em;max-width:21ch;text-wrap:balance}
.h2 em{font-style:normal;color:var(--acc)}
.t-yel .h2 em{display:inline-block;background:var(--ink);color:var(--yel);line-height:1;padding:.05em .12em 0;margin-top:.08em}
.lead{font-size:clamp(17px,1.4vw,21px);line-height:1.4;color:var(--mut);max-width:60ch}
.lead b{color:var(--fg);font-weight:600}
.head{display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px)}
.note{font-size:13px;line-height:1.45;color:var(--mut)}
.note b{color:var(--fg);font-weight:600}

/* fita zebrada de sinalização */
.tape{position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(-45deg,var(--yel) 0 14px,var(--ink) 14px 28px)}
.tape.top{top:0}.tape.bot{bottom:0}

/* etiqueta de preço */
.ptag{position:relative;background:var(--yel);color:var(--ink);clip-path:polygon(26px 0,100% 0,100% 100%,26px 100%,0 50%);padding:16px 26px 16px 48px}
.ptag::before{content:"";position:absolute;left:19px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--bg,var(--ink))}

/* ---------- entrada animada ---------- */
.js [data-r]{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease) var(--d,0s),transform .9s var(--ease) var(--d,0s)}
.js .s.in [data-r]{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js [data-r]{opacity:1;transform:none;transition:none}}

/* ---------- 01 · capa ---------- */
.cover{justify-content:flex-end;padding-bottom:calc(14px + clamp(28px,5vh,56px))}
.cover .kicker{font:700 13px/1.3 var(--f-b);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.cover h1{font:800 clamp(80px,16vw,270px)/.8 var(--f-d);text-transform:uppercase;letter-spacing:-.012em;margin-top:clamp(10px,2vh,20px)}
.cover h1 span{display:block}
.cover h1 .y{color:var(--yel)}
.cover .sub{font:600 clamp(22px,2.5vw,40px)/1.05 var(--f-d);text-transform:uppercase;letter-spacing:.02em;max-width:30ch}
.meta{display:flex;flex-wrap:wrap;gap:14px clamp(24px,4vw,64px);padding-top:18px;border-top:1px solid var(--line)}
.meta small{display:block;font:700 11px/1 var(--f-b);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
.meta div{font-weight:600;font-size:16px}
.cover .ptag{position:absolute;right:calc(var(--px) + 2vw);top:calc(var(--bar) + 6vh);transform:rotate(7deg);transform-origin:left center}
.cover .ptag b{display:block;font:800 clamp(56px,6.4vw,104px)/.82 var(--f-d)}
.cover .ptag span{display:block;font:700 13px/1.2 var(--f-b);letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
.hint{position:absolute;right:var(--px);bottom:calc(14px + 22px);font:600 12px/1 var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}

/* ---------- 02 · desafio ---------- */
.ch{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4.5vw,80px);align-items:center;flex:1}
.tags{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tags .ptag{--bg:var(--yel);background:var(--ink);color:var(--yel);display:grid;grid-template-columns:auto auto;align-items:center;gap:18px;padding:12px 28px 12px 48px}
.tags .ptag b{font:800 clamp(46px,4.8vw,78px)/.85 var(--f-d);min-width:1.4ch}
.tags .ptag span{font:600 clamp(15px,1.25vw,19px)/1.2 var(--f-b);color:var(--white);max-width:16ch}
.rules{border-top:3px solid var(--ink)}
.rules li{display:grid;grid-template-columns:2.2ch minmax(0,1fr);gap:14px;padding:clamp(12px,2vh,18px) 0;border-bottom:1px solid var(--line)}
.rules .n{font:800 30px/1 var(--f-d)}
.rules b{display:block;font:800 clamp(20px,1.7vw,26px)/1 var(--f-d);text-transform:uppercase;letter-spacing:.02em;margin-bottom:5px}
.rules p{font-size:clamp(15px,1.1vw,17px);line-height:1.4;color:#2E2608}

/* ---------- 03 · kit ---------- */
.kit .head{flex-direction:row;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.kit .h2{font-size:clamp(38px,4.4vw,72px)}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;font:600 12px/1 var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:22px;height:12px;border-radius:3px}
.legend .l1{background:var(--yel)}.legend .l2{border:1.5px solid rgba(255,255,255,.5)}.legend .l3{border:1.5px dashed rgba(255,255,255,.4)}
.zones{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,26px)}
.zones::before{content:"";position:absolute;left:12px;right:0;top:11px;border-top:2px dashed rgba(245,184,0,.55)}
.zone header{position:relative;margin-bottom:10px}
.zone .pin{display:block;width:24px;height:24px;border-radius:50%;background:var(--yel);color:var(--ink);font:800 14px/24px var(--f-d);text-align:center;margin-bottom:10px}
.zone h3{font:800 clamp(20px,1.6vw,26px)/1 var(--f-d);text-transform:uppercase;letter-spacing:.02em}
.zone header p{font:600 12px/1.3 var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:5px}
.zone ul{display:flex;flex-direction:column;gap:4px}
.pc{display:block;width:100%;text-align:left;font:500 clamp(13px,.95vw,14.5px)/1.2 var(--f-b);padding:5px 10px;border-radius:5px;border:1.5px solid transparent;transition:background .2s,border-color .2s,transform .2s}
.pc.p1{background:var(--yel);color:var(--ink);font-weight:600}
.pc.p2{border-color:rgba(255,255,255,.4)}
.pc.p3{border:1.5px dashed rgba(255,255,255,.32);color:var(--mut-d)}
.pc:hover{transform:translateX(3px)}
.pc.p2:hover,.pc.p3:hover{border-color:var(--white);color:var(--white)}
.pc.on{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--white)}
.det{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,2fr) minmax(0,1.3fr) minmax(0,.9fr);gap:clamp(14px,2vw,32px);align-items:start;background:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-top:auto}
.det .lb{font:700 11px/1 var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
.det .v{font-size:15px;line-height:1.4}
.det .nm{font:800 clamp(22px,1.8vw,28px)/1 var(--f-d);text-transform:uppercase;letter-spacing:.01em;margin-top:8px}
.det .zn{font-size:13px;color:var(--mut);margin-top:4px}
.prt{display:inline-block;font:700 11px/1 var(--f-b);letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.prt.p1{background:var(--yel);color:var(--ink)}
.prt.p2{border:1.5px solid rgba(255,255,255,.5)}
.prt.p3{border:1.5px dashed rgba(255,255,255,.45);color:var(--mut-d)}

/* ---------- 04 · cronograma ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,21vw,320px);gap:clamp(16px,2.4vw,36px);flex:1;align-content:center}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cal .dw{font:700 11px/1 var(--f-b);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding:0 2px 4px}
.cal .d{min-height:clamp(70px,12.5vh,120px);border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;background:#E5E0D4}
.cal .d b{font:800 clamp(22px,2vw,30px)/1 var(--f-d)}
.cal .d span{font:600 clamp(12px,.95vw,14px)/1.25 var(--f-b)}
.cal .d.past{background:transparent;border:1px dashed rgba(15,15,14,.2);color:#9C968A}
.cal .d.today{background:var(--white);box-shadow:inset 0 0 0 2px var(--ink)}
.cal .d.cop{background:var(--yel)}
.cal .d.gate{background:var(--yel);box-shadow:inset 0 0 0 3px var(--ink)}
.cal .d.lab{background:var(--ink);color:var(--white)}
.cal .d.prod{background:repeating-linear-gradient(135deg,#D6D0C2 0 8px,#E5E0D4 8px 16px)}
.cal .d.del{background:repeating-linear-gradient(-45deg,var(--yel) 0 12px,var(--ink) 12px 24px)}
.cal .d.del b,.cal .d.del span{align-self:flex-start;background:var(--white);color:var(--ink);padding:3px 6px;border-radius:4px}
.flag{display:inline-block;font:700 10px/1 var(--f-b);letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--yel);padding:3px 6px;border-radius:3px;margin-left:6px;vertical-align:3px}
.nov{background:var(--ink);color:var(--white);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.nov h3{font:800 22px/1 var(--f-d);text-transform:uppercase;letter-spacing:.03em;color:var(--yel)}
.nov li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.14)}
.nov li:last-child{border-bottom:0;padding-bottom:0}
.nov li b{font:800 24px/1 var(--f-d);white-space:nowrap;min-width:3.2ch}
.nov li span{font-size:14px;line-height:1.35;color:#D9D4C8}
.nov li.bf b,.nov li.bf span{color:var(--yel)}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 20px;font:600 12px/1 var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.cal-legend span{display:flex;align-items:center;gap:7px}
.cal-legend i{width:22px;height:12px;border-radius:3px;display:inline-block}
.cal-legend .k1{background:var(--yel)}.cal-legend .k2{background:var(--ink)}.cal-legend .k3{background:repeating-linear-gradient(135deg,#C9C2B2 0 4px,#E5E0D4 4px 8px)}.cal-legend .k4{background:repeating-linear-gradient(-45deg,var(--yel) 0 5px,var(--ink) 5px 10px)}

/* ---------- 05 · investimento ---------- */
.inv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px);flex:1;align-items:stretch}
.opt{--ol:rgba(255,255,255,.14);border:1px solid var(--ol);border-radius:10px;padding:clamp(18px,2.2vw,30px);display:flex;flex-direction:column;gap:clamp(10px,1.6vh,16px);background:var(--ink2)}
.opt.full{--ol:rgba(15,15,14,.2);background:var(--yel);color:var(--ink);border-color:var(--yel)}
.opt .k{font:700 12px/1 var(--f-b);letter-spacing:.16em;text-transform:uppercase;color:var(--mut-d)}
.opt.full .k{color:#4A3B00}
.opt h3{font:800 clamp(32px,3.2vw,52px)/.92 var(--f-d);text-transform:uppercase}
.opt .d{font-size:clamp(14px,1.05vw,16px);line-height:1.4;color:var(--mut-d);max-width:52ch}
.opt.full .d{color:#2E2608}
.opt dl{display:grid;grid-template-columns:minmax(0,1fr) auto;margin:0}
.opt dt,.opt dd{margin:0;padding:clamp(7px,1.1vh,10px) 0;border-bottom:1px solid var(--ol);font-size:15px}
.opt dd{text-align:right;font:700 17px/1.2 var(--f-d);letter-spacing:.02em}
.opt .tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:auto;padding-top:12px;border-top:3px solid currentColor}
.opt .tot span{font:700 12px/1 var(--f-b);letter-spacing:.16em;text-transform:uppercase}
.opt .tot b{font:800 clamp(30px,3vw,46px)/1 var(--f-d)}

/* ---------- 06 · próximos passos ---------- */
.end{padding-bottom:calc(14px + clamp(28px,5vh,56px))}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,32px);flex:1;align-content:center}
.steps li{border-top:3px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.steps b{font:800 clamp(56px,6vw,100px)/.8 var(--f-d)}
.steps p{font-size:clamp(16px,1.3vw,20px);line-height:1.35;font-weight:500;max-width:22ch}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,3vw,48px);align-items:center;padding-top:18px;border-top:1px solid var(--line)}
.contact img{height:34px;width:auto}
.contact .lb{font:700 11px/1 var(--f-b);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.contact p{font-size:15px;line-height:1.45}

/* ---------- celular e telas baixas ---------- */
@media (max-width:1100px){
  .zones{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}
  .zones::before{display:none}
  .det{position:sticky;bottom:12px;z-index:3;grid-template-columns:minmax(0,1fr) minmax(0,1fr);box-shadow:0 16px 40px -12px rgba(0,0,0,.7)}
  .det>div:first-child,.det>div:nth-child(2){grid-column:1/-1}
}
@media (max-width:900px){
  .dots{display:none}
  .ch,.cal-wrap,.inv{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .contact{grid-template-columns:minmax(0,1fr)}
  .cover .ptag{position:relative;right:auto;top:auto;align-self:flex-start;margin-bottom:auto;transform:rotate(-4deg)}
  .hint{display:none}
}
@media (max-width:600px){
  :root{--bar:54px}
  .brand{font-size:19px;gap:9px}
  .zones{grid-template-columns:minmax(0,1fr)}
  .cal{gap:4px}
  .cal .d{padding:7px 6px;min-height:64px}
  .cal .d span{font-size:11px}
  .cal .dw{font-size:10px;letter-spacing:.08em}
  .steps{grid-template-columns:minmax(0,1fr)}
  .tags .ptag{padding:10px 20px 10px 44px}
}
@media (min-width:1101px) and (max-height:760px){
  .pc{padding:4px 9px;font-size:12.5px}
  .zone ul{gap:4px}
  .det{padding:12px 16px}
}
</style>
