<script>document.documentElement.classList.add('js')</script>
<title>Black Friday Copafer · Copafer × 75 LAB</title>
<meta name="description" content="Kit de materiais de PDV para a Black Friday das lojas Copafer de Santo André e Mauá · 75 LAB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
/* Black Friday Copafer · template a partir do KV da campanha
   Vermelho Copafer, amarelo-limão, etiqueta preta e o mascote. Telas limpas, uma ideia por tela,
   e um espaço de imagem para cada material de PDV (assets/pdv/). */
:root{
  --red:#D0040C;
  --red-d:#A30309;
  --yel:#FFF500;
  --ink:#141414;
  --paper:#F4F2EE;
  --white:#FFFFFF;
  --gray:#6B665E;
  --f:"Montserrat",Arial,sans-serif;
  --px:clamp(20px,5.5vw,96px);
  --bar:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ui:var(--white);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--red);color:var(--white);font:500 16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body[data-tone="light"]{--ui:var(--ink)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
body[data-tone="light"] :focus-visible{outline-color:var(--red)}

/* ---------- telas ---------- */
.s{--bg:var(--red);--fg:var(--white);--mut:rgba(255,255,255,.78);--line:rgba(255,255,255,.22);--acc:var(--yel);
  position:relative;min-height:100vh;min-height:100svh;padding:calc(var(--bar) + clamp(18px,4vh,48px)) var(--px) clamp(32px,6vh,64px);
  background:var(--bg);color:var(--fg);display:flex;flex-direction:column;gap:clamp(20px,3.6vh,40px);overflow:hidden;scroll-snap-align:start}
.s.t-light{--bg:var(--white);--fg:var(--ink);--mut:var(--gray);--line:rgba(20,20,20,.12);--acc:var(--red)}
.s.t-paper{--bg:var(--paper);--fg:var(--ink);--mut:var(--gray);--line:rgba(20,20,20,.12);--acc:var(--red)}
.s.t-dark{--bg:var(--ink);--fg:var(--white);--mut:rgba(255,255,255,.66);--line:rgba(255,255,255,.14);--acc:var(--yel)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra ---------- */
.bar{position:fixed;z-index:20;top:0;left:0;right:0;height:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 var(--px);color:var(--ui);pointer-events:none;transition:color .4s}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.cop{display:inline-block;background:var(--yel);color:var(--red);font:900 17px/1 var(--f);letter-spacing:.01em;padding:7px 10px 6px}
.brand .x{font-weight:600;opacity:.6}
.brand img{height:16px;width:auto;filter:brightness(0) invert(1);transition:filter .4s}
body[data-tone="light"] .brand img{filter:none}
.count{font:700 13px/1 var(--f);letter-spacing:.12em;font-variant-numeric:tabular-nums}

/* ---------- texto ---------- */
.eyebrow{font:800 12px/1.2 var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.h2{font:900 clamp(36px,4.6vw,76px)/1 var(--f);letter-spacing:-.025em;max-width:18ch;text-wrap:balance}
.h2 em{font-style:normal;color:var(--acc)}
.lead{font-size:clamp(16px,1.3vw,20px);line-height:1.5;color:var(--mut);max-width:56ch;font-weight:500}
.lead b{color:var(--fg);font-weight:700}
.head{display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px)}
.note{font-size:13.5px;line-height:1.5;color:var(--mut)}
.note b{color:var(--fg)}
.s.mid{justify-content:center;gap:clamp(32px,7vh,80px)}
.s.mid .nums,.s.mid .tl,.s.mid .steps{margin-top:0}

/* ---------- entrada animada ---------- */
.js [data-r]{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease) var(--d,0s),transform .9s var(--ease) var(--d,0s)}
.js .s.in [data-r]{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js [data-r]{opacity:1;transform:none;transition:none}}

/* ---------- etiqueta (do KV) ---------- */
.tag{--cut:clamp(40px,5vw,84px);position:relative;display:inline-block;background:var(--yel);padding:5px;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% 38%,100% 62%,calc(100% - var(--cut)) 100%,0 100%)}
.tag-in{position:relative;background:var(--ink);clip-path:polygon(0 0,calc(100% - var(--cut) + 2px) 0,100% 38%,100% 62%,calc(100% - var(--cut) + 2px) 100%,0 100%);padding:clamp(14px,2vh,24px) calc(var(--cut) + clamp(30px,3vw,56px)) clamp(14px,2vh,24px) clamp(20px,2.4vw,40px)}
.tag-in::after{content:"";position:absolute;right:calc(var(--cut) * .55);top:50%;width:clamp(20px,2vw,34px);aspect-ratio:1;border-radius:50%;border:clamp(5px,.5vw,8px) solid var(--yel);transform:translateY(-50%)}

/* ---------- 01 · capa ---------- */
.cover{justify-content:center;padding-bottom:calc(clamp(56px,9vh,84px) + clamp(24px,4vh,40px))}
.cover .copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,2.4vh,24px);max-width:min(62vw,880px)}
.cover .kicker{font:700 13px/1.3 var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.cover .cop-big{background:var(--yel);color:var(--red);font:900 clamp(34px,4.4vw,72px)/1 var(--f);letter-spacing:-.01em;padding:.12em .28em .08em}
.cover h1{font:900 clamp(60px,9.2vw,160px)/.86 var(--f);letter-spacing:-.035em;color:var(--white)}
.cover h1 span{display:block}
.cover h1 .y{color:var(--yel)}
.cover h1 small{display:block;text-align:right;font:800 clamp(14px,1.3vw,22px)/1 var(--f);letter-spacing:.04em;color:var(--white);margin-top:.6em}
.cover .tagline{font:800 clamp(22px,2.6vw,44px)/1.1 var(--f);letter-spacing:-.015em}
.hero{position:absolute;z-index:1;top:0;right:0;height:100%;aspect-ratio:632/820;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
.hero img{position:absolute;top:0;right:0;height:114.8%;width:auto;max-width:none}
.band{position:absolute;z-index:3;left:0;bottom:clamp(24px,4vh,40px);background:var(--ink);color:var(--white);font:800 clamp(16px,1.7vw,28px)/1 var(--f);letter-spacing:-.01em;padding:clamp(16px,2.2vh,22px) clamp(48px,6vw,96px) clamp(16px,2.2vh,22px) var(--px);clip-path:polygon(0 0,100% 0,calc(100% - 36px) 100%,0 100%)}
.band span{color:var(--yel)}

/* ---------- 02 · desafio ---------- */
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-top:auto}
.nums li{padding:clamp(18px,3vh,32px) clamp(16px,2vw,32px) 0 0;display:flex;flex-direction:column;gap:8px}
.nums li+li{padding-left:clamp(16px,2vw,32px);border-left:1px solid var(--line)}
.nums b{font:900 clamp(64px,8vw,136px)/.85 var(--f);letter-spacing:-.04em;color:var(--red)}
.nums span{font:700 clamp(15px,1.25vw,19px)/1.3 var(--f);max-width:18ch}
.crit{display:flex;flex-wrap:wrap;gap:10px 28px;font:600 14px/1.4 var(--f);color:var(--mut)}
.crit li{display:flex;align-items:center;gap:10px}
.crit li::before{content:"";width:10px;height:10px;background:var(--yel);box-shadow:0 0 0 2px var(--ink);flex:none}

/* ---------- 03 · kit ---------- */
.kit-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:700 14px/1 var(--f);padding:11px 16px;border-radius:99px;background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(20,20,20,.12);transition:background .25s,color .25s,box-shadow .25s}
.tabs button span{opacity:.55;margin-left:6px;font-weight:600}
.tabs button:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tabs button[aria-selected="true"]{background:var(--red);color:var(--white);box-shadow:none}
.tabs button[aria-selected="true"] span{opacity:.8}
.kit-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font:600 12.5px/1 var(--f);color:var(--mut)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend .l1{background:var(--yel);box-shadow:inset 0 0 0 1.5px var(--ink)}.legend .l2{box-shadow:inset 0 0 0 1.5px var(--ink)}.legend .l3{border:1.5px dashed var(--gray)}
.arrows{display:flex;gap:8px}
.arrows button{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center;transition:background .2s,opacity .2s}
.arrows button:hover{background:var(--red)}
.arrows button:disabled{opacity:.25;cursor:default;background:var(--ink)}
.arrows svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2}
/* filtros: prioridade (P1 · P2 · P3) | área da loja */
.tabs .sep{width:1px;height:28px;background:rgba(20,20,20,.16);margin:0 6px;align-self:center}
.tabs .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.tabs .d1{background:var(--yel);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tabs .d2{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tabs .d3{border:1.5px dashed var(--gray)}
.tabs button[aria-selected="true"] .d1{box-shadow:none}
.tabs button[aria-selected="true"] .d2{box-shadow:inset 0 0 0 1.5px var(--white)}
.tabs button[aria-selected="true"] .d3{border-color:var(--white)}
/* setas laterais do carrossel */
.rail-wrap{position:relative}
.rail-wrap::after{content:"";position:absolute;top:0;bottom:18px;right:calc(var(--px) * -1);width:clamp(40px,6vw,96px);background:linear-gradient(90deg,rgba(244,242,238,0),var(--paper));pointer-events:none;transition:opacity .3s}
.rail-wrap.end::after{opacity:0}
.side{position:absolute;z-index:3;top:calc(50% - 32px);width:44px;height:44px;border-radius:50%;background:var(--white);color:var(--ink);display:grid;place-items:center;box-shadow:0 8px 22px -8px rgba(20,20,20,.4),0 0 0 1px rgba(20,20,20,.06);transition:opacity .25s,background .2s,color .2s}
.side:hover{background:var(--red);color:var(--white)}
.side.prev{left:calc(var(--px) * -1 + 16px)}
.side.next{right:calc(var(--px) * -1 + 16px)}
.side:disabled{opacity:0;pointer-events:none}
.side svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4}
.card .zn{font:800 10.5px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.rail{display:flex;gap:clamp(12px,1.4vw,20px);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:var(--px);margin:0 calc(var(--px) * -1);padding:4px var(--px) 18px;scrollbar-width:thin;scrollbar-color:rgba(20,20,20,.25) transparent;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{height:6px}.rail::-webkit-scrollbar-thumb{background:rgba(20,20,20,.22);border-radius:6px}
.card{flex:0 0 clamp(236px,20.5vw,312px);scroll-snap-align:start;background:var(--white);border-radius:14px;overflow:hidden;box-shadow:0 1px 0 rgba(20,20,20,.04),0 14px 34px -22px rgba(20,20,20,.35);display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/3;background:#ECE8E1;overflow:hidden}
.ph .ph-empty{position:absolute;inset:12px;border:1.5px dashed rgba(20,20,20,.18);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#9A948A;font:600 12px/1.2 var(--f);text-align:center}
.ph .ph-empty svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px;background:var(--white)}
.ph.audio{background:var(--ink)}
.ph.audio .ph-empty{border-color:rgba(255,255,255,.2);color:var(--yel)}
.pr{position:absolute;z-index:2;left:12px;top:12px;font:800 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:99px;background:var(--white);color:var(--ink)}
.pr.p1{background:var(--yel)}
.pr.p3{background:var(--white);box-shadow:inset 0 0 0 1.5px var(--gray);color:var(--gray)}
.card .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font:800 17px/1.2 var(--f);letter-spacing:-.01em}
.card .m{font-size:13px;line-height:1.45;color:var(--gray);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.35}
.card dt{font:700 10.5px/1.6 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.card dd{font-weight:600}

/* ---------- 04 · cronograma ---------- */
.tl{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(12px,2vw,28px);margin-top:auto}
.tl::before{content:"";position:absolute;left:0;right:0;top:calc(clamp(40px,4.4vw,72px) + 22px);height:2px;background:var(--line)}
.tl li{position:relative;display:flex;flex-direction:column;gap:10px}
.tl b{font:900 clamp(40px,4.4vw,72px)/1 var(--f);letter-spacing:-.04em;white-space:nowrap}
.tl i{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;background:var(--white);box-shadow:inset 0 0 0 3px var(--ink);margin:6px 0}
.tl h3{font:800 clamp(16px,1.3vw,20px)/1.2 var(--f)}
.tl p{font-size:14px;line-height:1.45;color:var(--mut);max-width:24ch}
.tl .hot b{color:var(--red)}
.tl .hot i{background:var(--red);box-shadow:0 0 0 6px rgba(208,4,12,.15)}
.tl .end i{background:var(--ink)}
.pill{display:inline-block;font:800 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:99px;margin-left:8px;vertical-align:3px}
.pill.r{background:var(--red);color:var(--white)}.pill.k{background:var(--ink);color:var(--yel)}
.after{display:flex;flex-wrap:wrap;gap:10px 28px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.after b{color:var(--fg)}

/* ---------- 05 · investimento ---------- */
.inv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px);flex:1;align-items:stretch}
.opt{--ol:rgba(255,255,255,.14);border-radius:16px;padding:clamp(20px,2.4vw,34px);display:flex;flex-direction:column;gap:clamp(10px,1.6vh,16px);background:#1F1F1F}
.opt.full{--ol:rgba(20,20,20,.16);background:var(--yel);color:var(--ink)}
.opt .k{font:800 12px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.opt.full .k{color:var(--red)}
.opt h3{font:900 clamp(30px,3vw,48px)/1 var(--f);letter-spacing:-.03em}
.opt .d{font-size:clamp(14px,1.05vw,16px);line-height:1.5;color:rgba(255,255,255,.7);max-width:50ch}
.opt.full .d{color:#3B3700}
.opt dl{display:grid;grid-template-columns:minmax(0,1fr) auto}
.opt dt,.opt dd{padding:clamp(7px,1.1vh,10px) 0;border-bottom:1px solid var(--ol);font-size:15px}
.opt dd{text-align:right;font-weight:800}
.opt .tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:auto;padding-top:14px}
.opt .tot span{font:800 12px/1 var(--f);letter-spacing:.16em;text-transform:uppercase}
.opt .tot b{font:900 clamp(26px,2.6vw,42px)/1 var(--f);letter-spacing:-.03em}

/* ---------- 06 · próximos passos ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,32px);margin-top:auto}
.steps li{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:2px solid rgba(255,255,255,.35)}
.steps b{font:900 clamp(48px,5vw,84px)/.85 var(--f);color:var(--yel);letter-spacing:-.04em}
.steps p{font:700 clamp(16px,1.3vw,20px)/1.35 var(--f);max-width:22ch}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,3vw,48px);align-items:center;padding-top:20px;border-top:1px solid var(--line)}
.contact img{height:30px;width:auto;filter:brightness(0) invert(1)}
.contact .lb{font:800 11px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--yel);margin-bottom:6px}
.contact p{font-size:14.5px;line-height:1.5}

/* ---------- modo apresentação (telas ≥ 900 px): uma tela por vez, sem rolagem ---------- */
.deck,.deck body{height:100%;overflow:hidden;overscroll-behavior:none}
.deck main{position:fixed;inset:0}
.deck .s{position:absolute;inset:0;min-height:0;height:100%;visibility:hidden;overflow-x:hidden;overflow-y:auto;padding-bottom:clamp(80px,11vh,104px)}
.deck .s.on,.deck .s.leaving{visibility:visible}
.deck .s.on{z-index:2}
.deck .s.leaving{z-index:1}
.deck .s.from-r{animation:inR .85s var(--ease) both}
.deck .s.from-l{animation:inL .85s var(--ease) both}
.deck .s.to-l{animation:outL .85s var(--ease) both}
.deck .s.to-r{animation:outR .85s var(--ease) both}
@keyframes inR{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes inL{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes outL{to{transform:translateX(-7%)}}
@keyframes outR{to{transform:translateX(7%)}}
/* faixa amarela que acompanha a borda da transição */
.wipe{position:fixed;z-index:15;top:0;bottom:0;left:100%;width:10px;margin-left:-5px;background:var(--yel);pointer-events:none;display:none}
.wipe.run-l{display:block;animation:bandL .85s var(--ease) both}
.wipe.run-r{display:block;animation:bandR .85s var(--ease) both}
@keyframes bandL{from{left:100%}to{left:0}}
@keyframes bandR{from{left:0}to{left:100%}}
/* controles */
.nav{position:fixed;z-index:20;right:var(--px);bottom:clamp(18px,3vh,30px);display:none;align-items:center;gap:14px;color:var(--ui);transition:color .4s}
.deck .nav{display:flex}
.nav .arw{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;display:grid;place-items:center;transition:background .2s,opacity .2s}
.nav .arw:hover{background:rgba(255,255,255,.16)}
body[data-tone="light"] .nav .arw:hover{background:rgba(20,20,20,.07)}
.nav .arw:disabled{opacity:.28;cursor:default;background:none}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2}
.segs{display:flex;gap:4px}
.segs button{width:26px;height:24px;display:grid;place-items:center}
.segs i{display:block;width:100%;height:4px;border-radius:2px;background:currentColor;opacity:.3;transition:opacity .3s,background .3s}
.segs button:hover i{opacity:.65}
.segs button[aria-current="true"] i{opacity:1;background:var(--yel)}
body[data-tone="light"] .segs button[aria-current="true"] i{background:var(--red)}
.cover .band{z-index:3}
@media (prefers-reduced-motion:reduce){.deck .s{animation:none!important}.wipe{display:none!important}}

/* ---------- celular ---------- */
@media (max-width:900px){
  .cover{justify-content:flex-start;padding-bottom:calc(clamp(56px,9vh,84px) + 24px)}
  .cover .copy{max-width:none}
  .hero{position:relative;order:3;align-self:center;height:min(68vw,420px);margin:0 calc(var(--px) * -1) -8px;width:auto;
    -webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);mask-image:linear-gradient(180deg,#000 75%,transparent)}
  .nums,.inv{grid-template-columns:minmax(0,1fr)}
  .nums li+li{padding-left:0;border-left:0;border-top:1px solid var(--line)}
  .nums li{padding:16px 0}
  .tl{grid-template-columns:minmax(0,1fr);gap:18px}
  .tl::before{display:none}
  .tl li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:baseline}
  .tl i{display:none}
  .tl b{font-size:34px;grid-row:span 2;min-width:4.4ch}
