<script>
/* ---------- o kit: 24 peças por loja ----------
   Cada peça tem um número (01–24) que é também o nome da imagem em assets/pdv/:
   assets/pdv/01-lona-de-fachada.jpg (aceita .jpg, .png ou .webp).
   s: substrato (resumo para a visão geral) · pr: 1 essencial · 2 recomendada · 3 opcional */
var ZONES = [
  { id: 'fora', name: 'Lado de fora' },
  { id: 'teto', name: 'Entrada e teto' },
  { id: 'gondola', name: 'Gôndolas e pallets' },
  { id: 'caixa', name: 'Checkout e telas' }
];
var KIT = [
  { z: 'fora', pr: 1, f: 'lona-de-fachada', n: 'Lona de fachada', s: 'Lona front-light 440 g', m: 'Lona front-light 440 g com ilhós, ou tela mesh se a fachada pega vento. Ref. 10 × 3 m, na estrutura existente.', q: '1 por fachada visível da avenida' },
  { z: 'fora', pr: 1, f: 'adesivo-de-portas-e-vidros', n: 'Adesivo de portas e vidros', s: 'Vinil perfurado one-way', m: 'Vinil perfurado one-way vision, que mantém a visão de dentro para fora.', q: '1 por loja' },
  { z: 'fora', pr: 1, f: 'wind-banner', n: 'Wind banner', s: 'Tecido sublimado com haste', m: 'Tecido sublimado, haste de fibra e base com peso d’água ou espeto de solo. Ref. 3 m.', q: '8 a 12' },
  { z: 'fora', pr: 2, f: 'lona-de-gradil', n: 'Lona de gradil ou muro', s: 'Lona 440 g com ilhós', m: 'Lona 440 g com ilhós e abraçadeiras. Ref. 5 × 1 m.', q: '1 por loja' },
  { z: 'fora', pr: 2, f: 'banner-de-coluna', n: 'Banner de coluna', s: 'Lona blackout dupla face', m: 'Lona dupla face blackout com bastão, preso à coluna. Ref. 0,6 × 1,5 m.', q: '3 por loja' },

  { z: 'teto', pr: 1, f: 'portico-de-entrada', n: 'Pórtico de entrada', s: 'Treliça Q30 com lona', m: 'Treliça Q30 locada com lona ou tecido sublimado. Ref. 4 × 3 m.', q: '1 por entrada de clientes' },
  { z: 'teto', pr: 1, f: 'banner-aereo-de-departamento', n: 'Banner aéreo de departamento', s: 'Lona blackout dupla face', m: 'Lona dupla face blackout com bastão e cabo de aço, “Black Friday em [departamento]”. Ref. 3 × 1,5 m.', q: '5 por loja' },
  { z: 'teto', pr: 1, f: 'mobile', n: 'Móbile', s: 'PS 2 mm dupla face', m: 'PS 2 mm dupla face com recorte especial. Ref. 60 × 60 cm.', q: '20 por loja' },
  { z: 'teto', pr: 1, f: 'totem-de-chao', n: 'Totem de chão', s: 'Papelão micro-ondulado', m: 'Papelão micro-ondulado de 3 faces, ou PS com base. Ref. 0,6 × 1,8 m.', q: '4 por loja' },
  { z: 'teto', pr: 2, f: 'placa-de-carrinho', n: 'Placa de carrinho', s: 'PS 2 mm', m: 'Placa em PS 2 mm na frente do carrinho. Ref. 30 × 20 cm.', q: '30 por loja' },
  { z: 'teto', pr: 2, f: 'roll-up', n: 'Roll-up', s: 'Lona ou poliéster', m: 'Lona ou poliéster nas bases retráteis que a loja já tem. Ref. 0,85 × 2 m.', q: '2 por loja' },
  { z: 'teto', pr: 3, f: 'adesivo-de-piso-direcional', n: 'Adesivo de piso direcional', s: 'Vinil antiderrapante', m: 'Vinil antiderrapante, fora da rota de empilhadeira. Ref. 60 cm.', q: '10 por loja' },

  { z: 'gondola', pr: 1, f: 'modelos-editaveis-de-cartaz', n: 'Modelos editáveis de cartaz', s: 'Arquivo digital, A6 a A3', m: 'Arquivos de A6 a A3 para a impressora da loja, com campos de produto, preço e condição.', q: '1 kit (entrega digital)' },
  { z: 'gondola', pr: 1, f: 'faixa-de-gondola', n: 'Faixa de gôndola', s: 'PS 0,3 mm', m: 'PS 0,3 mm ou couché laminado, encaixado na canaleta de preço.', q: '50 por loja' },
  { z: 'gondola', pr: 1, f: 'stopper', n: 'Stopper', s: 'PS 1 mm', m: 'PS 1 mm perpendicular à prateleira. Ref. 20 × 15 cm.', q: '50 por loja' },
  { z: 'gondola', pr: 1, f: 'wobbler', n: 'Wobbler', s: 'PS 0,5 mm com haste', m: 'PS 0,5 mm com haste flexível e adesivo. Ref. 10 cm.', q: '50 por loja' },
  { z: 'gondola', pr: 1, f: 'splash-adesivo', n: 'Splash adesivo', s: 'Adesivo em rolo', m: 'Adesivo em rolo com o selo Black Friday, para etiquetas e embalagens. Ref. 5 cm.', q: '100 por loja' },

  { z: 'caixa', pr: 1, f: 'botton-da-equipe', n: 'Botton da equipe', s: 'Botton 5,5 cm com alfinete', m: 'Botton de 5,5 cm com alfinete, no uniforme de quem atende.', q: '15 por loja' },
  { z: 'caixa', pr: 1, f: 'video-para-tvs', n: 'Vídeo para TVs e monitores', s: 'Vídeo 16:9 e 9:16', m: 'Loops de 15 e 30 s, em 16:9 e 9:16, para as TVs e monitores da loja.', q: '1 conjunto por loja' },
  { z: 'caixa', pr: 2, f: 'display-de-balcao', n: 'Display de balcão', s: 'PS A5 ou A4', m: 'PS A5 ou A4 com os serviços da loja e o QR code do grupo VIP de WhatsApp.', q: '3 por loja' },
  { z: 'caixa', pr: 2, au: 1, f: 'spot-de-radio-interna', n: 'Spot de rádio interna', s: 'Áudio de 30 s', m: 'Locução institucional de 30 s, repetida a cada 15 minutos.', q: '1 a 2 versões' },
  { z: 'caixa', pr: 3, f: 'adesivo-de-piso-da-fila', n: 'Adesivo de piso da fila', s: 'Vinil antiderrapante', m: 'Vinil antiderrapante na fila do checkout. Ref. 40 cm.', q: '10 por loja' },
  { z: 'caixa', pr: 3, f: 'divisor-de-esteira', n: 'Divisor de esteira', s: 'PS impresso ou adesivo', m: 'Adesivo sobre o divisor existente, ou divisor novo em PS impresso.', q: '5 por loja' },
  { z: 'caixa', pr: 3, f: 'camiseta-da-campanha', n: 'Camiseta da campanha', s: 'Malha com DTF ou silk', m: 'Malha com estampa DTF ou silk, ou patch sobre o colete atual.', q: '15 por loja' }
];

(function () {
  var doc = document, html = doc.documentElement;
  var S = [].slice.call(doc.querySelectorAll('.s'));
  var cNow = doc.getElementById('cNow'), cAll = doc.getElementById('cAll');
  var segs = doc.getElementById('segs'), prevS = doc.getElementById('prevS'), nextS = doc.getElementById('nextS');
  var wipe = doc.getElementById('wipe'), live = doc.getElementById('live');
  var cur = 0, busy = false, isDeck = false, DUR = 850;
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // modo apresentação (uma tela por vez) em telas largas; no celular, rolagem vertical
  var deckMQ = matchMedia('(min-width: 900px) and (min-height: 420px)');
  // palco 16:9: escala para caber inteiro na janela, sem rolagem
  var stage = doc.getElementById('stage'), bar = doc.querySelector('.bar');
  function fit() {
    if (!isDeck) { stage.style.removeProperty('--k'); return; }
    stage.style.setProperty('--k', Math.min(innerWidth / 1440, innerHeight / 810));
  }
  addEventListener('resize', fit);
  cAll.textContent = pad(S.length);

  // barra de progresso clicável
  S.forEach(function (s, i) {
    var li = doc.createElement('li'), b = doc.createElement('button');
    b.type = 'button';
    b.title = pad(i + 1) + ' · ' + s.dataset.title;
    b.setAttribute('aria-label', b.title);
    b.innerHTML = '<i></i>';
    b.addEventListener('click', function () { go(i); });
    li.appendChild(b);
    segs.appendChild(li);
  });
  var segBtns = [].slice.call(segs.querySelectorAll('button'));

  function setActive(i) {
    cur = i;
    doc.body.dataset.tone = S[i].dataset.tone || 'red';
    // fora do palco (faixas laterais ou superiores), a página assume a cor da tela atual
    doc.body.style.backgroundColor = isDeck ? getComputedStyle(S[i]).backgroundColor : '';
    // no celular (rolagem), a barra ganha o fundo da tela atual para o texto não passar por baixo dela
    bar.style.backgroundColor = isDeck ? '' : getComputedStyle(S[i]).backgroundColor;
    cNow.textContent = pad(i + 1);
    segBtns.forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    prevS.disabled = i === 0;
    nextS.disabled = i === S.length - 1;
    if (history.replaceState) history.replaceState(null, '', '#s' + (i + 1));
  }
  function reveal(s, delay) {
    s.classList.remove('in');
    void s.offsetWidth;
    setTimeout(function () { s.classList.add('in'); }, delay);
  }
  // troca de tela: a próxima entra num recorte que corre pela tela, com a faixa amarela na borda
  function show(i) {
    if (i === cur || busy) return;
    var from = S[cur], to = S[i], fwd = i > cur;
    to.scrollTop = 0;
    if (!reduce) {
      busy = true;
      from.classList.add('leaving', fwd ? 'to-l' : 'to-r');
      to.classList.add(fwd ? 'from-r' : 'from-l');
      wipe.className = 'wipe';
      void wipe.offsetWidth;
      wipe.className = 'wipe ' + (fwd ? 'run-l' : 'run-r');
      setTimeout(function () {
        from.classList.remove('leaving', 'to-l', 'to-r');
        to.classList.remove('from-r', 'from-l');
        wipe.className = 'wipe';
        busy = false;
      }, DUR);
    }
    from.classList.remove('on');
    to.classList.add('on');
    reveal(to, reduce ? 0 : 280);
    setActive(i);
    live.textContent = 'Tela ' + (i + 1) + ' de ' + S.length + ': ' + to.dataset.title;
  }
  function go(i) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (isDeck) show(i);
    else S[i].scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }
  function enterDeck() {
    isDeck = true;
    html.classList.add('deck');
    S.forEach(function (s, j) {
      s.classList.remove('leaving', 'to-l', 'to-r', 'from-r', 'from-l');
      s.classList.toggle('on', j === cur);
      s.classList.add('in');
    });
    window.scrollTo(0, 0);
    fit();
    setActive(cur);
  }
  function exitDeck() {
    isDeck = false;
    busy = false;
    html.classList.remove('deck');
    wipe.className = 'wipe';
    S.forEach(function (s) { s.classList.remove('on', 'leaving', 'to-l', 'to-r', 'from-r', 'from-l'); s.classList.add('in'); });
    fit();
    doc.body.style.backgroundColor = '';
    S[cur].scrollIntoView();
  }

  // rolagem (celular): tela ativa = a que cruza o meio da janela
  if ('IntersectionObserver' in window) {
    var mid = new IntersectionObserver(function (es) {
      if (isDeck) return;
      es.forEach(function (e) { if (e.isIntersecting) setActive(S.indexOf(e.target)); });
    }, { rootMargin: '-50% 0px -50% 0px', threshold: 0 });
    var rev = new IntersectionObserver(function (es) {
      if (isDeck) return;
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); rev.unobserve(e.target); } });
    }, { threshold: 0.12 });
    S.forEach(function (s) { mid.observe(s); rev.observe(s); });
  }

  // início (aceita link direto #s3)
  var m = location.hash.match(/^#s(\d+)$/);
  if (m && S[+m[1] - 1]) cur = +m[1] - 1;
  if (deckMQ.matches) { enterDeck(); reveal(S[cur], 120); }
  else {
    setActive(cur);
    // celular: o link direto (#s3) rola até a tela depois que imagens e fontes carregam
    var startI = cur;
    if (startI) addEventListener('load', function () { if (!isDeck) S[startI].scrollIntoView(); });
  }
  var onMode = function () { if (deckMQ.matches && !isDeck) enterDeck(); else if (!deckMQ.matches && isDeck) exitDeck(); };
  if (deckMQ.addEventListener) deckMQ.addEventListener('change', onMode); else deckMQ.addListener(onMode);

  prevS.addEventListener('click', function () { go(cur - 1); });
  nextS.addEventListener('click', function () { go(cur + 1); });
  doc.querySelector('.brand').addEventListener('click', function (e) { e.preventDefault(); go(0); });

  // toque (tablet em modo apresentação): deslizar para os lados troca de tela, menos no carrossel do kit
  var tx = null, ty = 0;
  doc.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || (!lbOpen && (!isDeck || e.target.closest('.rail')))) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  doc.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (lbOpen) lbShow(lbI + (dx < 0 ? 1 : -1)); else go(cur + (dx < 0 ? 1 : -1));
    }
    tx = null;
  }, { passive: true });

  // ---------- kit ----------
  var prio = doc.getElementById('prio'), areas = doc.getElementById('areas'), rail = doc.getElementById('rail');
  var prevC = doc.getElementById('prevC'), nextC = doc.getElementById('nextC');
  var PR = { 1: ['p1', 'Essencial'], 2: ['p2', 'Recomendada'], 3: ['p3', 'Opcional'] };
  var ZN = {};
  ZONES.forEach(function (z) { ZN[z.id] = z.name; });
  // imagens presentes em assets/pdv/ (o build.ps1 preenche esta lista: nome sem extensão -> arquivo)
  var PDV = /*@@PDV@@*/{};
  KIT.forEach(function (k, i) { k.file = pad(i + 1) + '-' + k.f; });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function loadImg(ph, base, n) {
    if (!PDV[base]) return;
    var im = new Image();
    im.alt = n;
    im.loading = 'lazy';
    im.onload = function () { ph.classList.add('has-img'); };
    im.src = 'assets/pdv/' + PDV[base];
    ph.appendChild(im);
  }
  function card(k) {
    var p = PR[k.pr], has = !!PDV[k.file];
    var el = doc.createElement('article');
    el.className = 'card';
    var empty = k.au
      ? '<div class="ph-empty"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/></svg>Peça de áudio · 30 s</div>'
      : '<div class="ph-empty"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>Imagem do material</div>';
    el.innerHTML =
      (has
        ? '<button type="button" class="ph zoom" aria-label="Ampliar imagem: ' + esc(k.n) + '"><span class="pr ' + p[0] + '">' + p[1] + '</span>' + empty +
          '<span class="zoom-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4M11 8v6M8 11h6"/></svg></span></button>'
        : '<div class="ph' + (k.au ? ' audio' : '') + '"><span class="pr ' + p[0] + '">' + p[1] + '</span>' + empty + '</div>') +
      '<div class="bd"><p class="zn">' + esc(ZN[k.z]) + '</p><h3>' + esc(k.n) + '</h3><p class="m">' + esc(k.m) + '</p>' +
      '<dl><dt>Qtd.</dt><dd>' + esc(k.q) + '</dd></dl></div>';
    loadImg(el.querySelector('.ph'), k.file, k.n);
    if (has) el.querySelector('.ph').addEventListener('click', function () { openLb(k); });
    return el;
  }
  var railWrap = doc.getElementById('railWrap');
  function arrows() {
    prevC.disabled = rail.scrollLeft <= 4;
    nextC.disabled = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 4;
    railWrap.classList.toggle('end', nextC.disabled);
  }
  // filtros combinados: prioridade (P1, P2, P3 ou todas) + área da loja (todas ou uma das 4)
  var PRIOS = [
    { pr: 1, name: 'P1 · Essencial', dot: 'd1' },
    { pr: 2, name: 'P2 · Recomendada', dot: 'd2' },
    { pr: 3, name: 'P3 · Opcional', dot: 'd3' },
    { pr: 0, name: 'Todas' }
  ];
  var sel = { pr: 1, z: '' };
  // ---------- imagem ampliada (navega pelas peças do filtro atual) ----------
  var shown = [];
  var lbx = doc.getElementById('lbx'), lbxImg = doc.getElementById('lbxImg'), lbxZn = doc.getElementById('lbxZn'),
      lbxNm = doc.getElementById('lbxNm'), lbxQt = doc.getElementById('lbxQt'), lbxCount = doc.getElementById('lbxCount'),
      lbxClose = doc.getElementById('lbxClose'), lbxPrev = doc.getElementById('lbxPrev'), lbxNext = doc.getElementById('lbxNext');
  var lbList = [], lbI = 0, lbLast = null;
  var lbOpen = false;
  lbxImg.addEventListener('load', function () {
    var narrow = innerWidth <= 700, w = lbxImg.naturalWidth, h = lbxImg.naturalHeight;
    var s = Math.min((innerWidth - (narrow ? 24 : 200)) / w, (innerHeight - (narrow ? 260 : 220)) / h, 1.8);
    lbxImg.style.width = Math.round(w * s) + 'px';
    lbxImg.style.height = Math.round(h * s) + 'px';
  });
  function lbShow(i) {
    lbI = (i + lbList.length) % lbList.length;
    var k = lbList[lbI];
    lbxImg.style.width = lbxImg.style.height = '';
    lbxImg.src = 'assets/pdv/' + PDV[k.file];
    lbxImg.alt = k.n;
    lbxZn.textContent = ZN[k.z] + ' · ' + PR[k.pr][1];
    lbxNm.textContent = k.n;
    lbxQt.textContent = 'Quantidade: ' + k.q;
    lbxCount.textContent = (lbI + 1) + ' / ' + lbList.length;
  }
  function openLb(k, list) {
    lbList = (list || shown).filter(function (x) { return PDV[x.file]; });
    lbLast = doc.activeElement;
    lbx.classList.toggle('single', lbList.length < 2);
    lbShow(Math.max(0, lbList.indexOf(k)));
    lbOpen = true;
    lbx.classList.add('open');
    lbx.setAttribute('aria-hidden', 'false');
    html.style.overflow = 'hidden';
    lbxClose.focus();
  }
  function closeLb() {
    lbOpen = false;
    lbx.classList.remove('open');
    lbx.setAttribute('aria-hidden', 'true');
    html.style.overflow = '';
    if (lbLast && lbLast.focus) lbLast.focus();
  }
  lbxClose.addEventListener('click', closeLb);
  lbxPrev.addEventListener('click', function () { lbShow(lbI - 1); });
  lbxNext.addEventListener('click', function () { lbShow(lbI + 1); });
  lbx.addEventListener('click', function (e) { if (e.target === lbx || e.target.classList.contains('lbx-stage')) closeLb(); });

  var okPr = function (k, pr) { return !pr || k.pr === pr; };
  var okZ = function (k, z) { return !z || k.z === z; };
  function render() {
    // prioridade (linha de cima)
    [].forEach.call(prio.querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', +b.dataset.pr === sel.pr ? 'true' : 'false'); });
    // áreas (linha de baixo): contagem conforme a prioridade escolhida
    [].forEach.call(areas.querySelectorAll('button'), function (b) {
      var n = KIT.filter(function (k) { return okPr(k, sel.pr) && okZ(k, b.dataset.z); }).length;
      b.querySelector('.c').textContent = n;
      b.disabled = n === 0;
      b.setAttribute('aria-pressed', b.dataset.z === sel.z ? 'true' : 'false');
    });
    rail.innerHTML = '';
    shown = KIT.filter(function (k) { return okPr(k, sel.pr) && okZ(k, sel.z); });
    shown.forEach(function (k) { rail.appendChild(card(k)); });
    rail.scrollLeft = 0;
    rail.setAttribute('aria-label', (sel.pr ? 'P' + sel.pr : 'Todas as prioridades') + ' · ' + (sel.z ? ZN[sel.z] : 'todas as áreas'));
    arrows();
  }
  PRIOS.forEach(function (x) {
    var b = doc.createElement('button');
    b.type = 'button';
    b.dataset.pr = x.pr;
    if (!x.pr) b.className = 'all';
    b.innerHTML = (x.dot ? '<i class="dot ' + x.dot + '" aria-hidden="true"></i>' : '') + esc(x.name) + '<span>' + KIT.filter(function (k) { return okPr(k, x.pr); }).length + '</span>';
    b.addEventListener('click', function () {
      sel.pr = x.pr;
      // se a área escolhida não tem peças nessa prioridade, volta para todas as áreas
      if (sel.z && !KIT.some(function (k) { return okPr(k, sel.pr) && okZ(k, sel.z); })) sel.z = '';
      render();
    });
    prio.appendChild(b);
  });
  var lbl = doc.createElement('span');
  lbl.className = 'lbl';
  lbl.textContent = 'Área da loja';
  areas.appendChild(lbl);
  [{ id: '', name: 'Todas' }].concat(ZONES).forEach(function (z, i) {
    var b = doc.createElement('button');
    b.type = 'button';
    b.dataset.z = z.id;
    b.innerHTML = (z.id ? '<i class="n" aria-hidden="true">' + i + '</i>' : '') + esc(z.name) + '<span class="c"></span>';
    b.addEventListener('click', function () { sel.z = z.id; render(); });
    areas.appendChild(b);
  });
  var step = function () { var c = rail.querySelector('.card'); return c ? (c.offsetWidth + 20) * 2 : 600; };
  prevC.addEventListener('click', function () { rail.scrollBy({ left: -step(), behavior: reduce ? 'auto' : 'smooth' }); });
  nextC.addEventListener('click', function () { rail.scrollBy({ left: step(), behavior: reduce ? 'auto' : 'smooth' }); });
  rail.addEventListener('scroll', arrows, { passive: true });
  addEventListener('resize', arrows);
  render();

  // ---------- visão geral: todas as peças numa tela, uma coluna por área ----------
  var macro = doc.getElementById('macro');
  // as colunas dividem a altura pelo número de peças da maior área, para as linhas se alinharem
  macro.style.setProperty('--rows', Math.max.apply(null, ZONES.map(function (z) { return KIT.filter(function (k) { return k.z === z.id; }).length; })));
  ZONES.forEach(function (z, i) {
    var ks = KIT.filter(function (k) { return k.z === z.id; });
    var col = doc.createElement('div'), ul = doc.createElement('ul');
    col.className = 'mz';
    col.innerHTML = '<h3><i class="n" aria-hidden="true">' + (i + 1) + '</i>' + esc(z.name) + '<span>' + ks.length + '</span></h3>';
    ks.forEach(function (k) {
      var li = doc.createElement('li'), has = !!PDV[k.file];
      li.innerHTML = (has

        '<div><p class="mn">' + esc(k.n) + '</p><p class="ms">' + esc(k.s) + '</p><p class="mq"><span class="mp p' + k.pr + '">P' + k.pr + '</span>' + esc(k.q) + '</p></div>';

  // ---------- teclado: → ↓ PageDown espaço avançam · ← ↑ PageUp voltam · Home/End ----------
  addEventListener('keydown', function (e) {

    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(S.length - 1); }
