<script>
(function () {
  var doc = document;
  doc.documentElement.classList.add('js');

  var S = [].slice.call(doc.querySelectorAll('.s'));
  var dots = doc.getElementById('dots');
  var cNow = doc.getElementById('cNow');
  var cAll = doc.getElementById('cAll');
  var cur = 0;
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  cAll.textContent = pad(S.length);

  // índice lateral
  S.forEach(function (s, i) {
    var li = doc.createElement('li');
    var b = doc.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', pad(i + 1) + ' · ' + s.dataset.title);
    b.innerHTML = '<span>' + pad(i + 1) + ' ' + s.dataset.title + '</span><i></i>';
    b.addEventListener('click', function () { go(i); });
    li.appendChild(b);
    dots.appendChild(li);
  });
  var dotBtns = [].slice.call(dots.querySelectorAll('button'));

  function setActive(i) {
    cur = i;
    doc.body.dataset.tone = S[i].dataset.tone || 'dark';
    cNow.textContent = pad(i + 1);
    dotBtns.forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    if (history.replaceState) history.replaceState(null, '', '#s' + (i + 1));
  }
  function go(i) {
    i = Math.max(0, Math.min(S.length - 1, i));
    S[i].scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }

  if ('IntersectionObserver' in window) {
    // tela ativa = a que cruza o meio da janela
    var mid = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) setActive(S.indexOf(e.target)); });
    }, { rootMargin: '-50% 0px -50% 0px', threshold: 0 });
    // entrada animada
    var rev = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); rev.unobserve(e.target); } });
    }, { threshold: 0.12 });
    S.forEach(function (s) { mid.observe(s); rev.observe(s); });
  } else {
    S.forEach(function (s) { s.classList.add('in'); });
  }
  setActive(0);

  // teclado: setas, PageUp/PageDown, Home/End
  addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    if (k === 'ArrowDown' || k === 'PageDown' || k === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    else if (k === 'ArrowUp' || k === 'PageUp' || k === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(S.length - 1); }
  });

  // deep link #s3
  var m = location.hash.match(/^#s(\d+)$/);
  if (m && S[+m[1] - 1]) setTimeout(function () { S[+m[1] - 1].scrollIntoView(); }, 60);

  // kit: detalhe da peça
  var PR = { p1: 'Essencial · P1', p2: 'Recomendada · P2', p3: 'Opcional · P3' };
  var chips = [].slice.call(doc.querySelectorAll('.pc'));
  var dPr = doc.getElementById('dPr'), dNm = doc.getElementById('dNm'), dZn = doc.getElementById('dZn'),
      dM = doc.getElementById('dM'), dQ = doc.getElementById('dQ'), dT = doc.getElementById('dT');
  function show(b) {
    chips.forEach(function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    dPr.className = 'prt ' + b.dataset.pr;
    dPr.textContent = PR[b.dataset.pr];
    dNm.textContent = b.textContent;
    dZn.textContent = b.closest('.zone').dataset.zone;
    dM.textContent = b.dataset.m;
    dQ.textContent = b.dataset.q;
    dT.textContent = b.dataset.t;
  }
  chips.forEach(function (b) { b.addEventListener('click', function () { show(b); }); });
  if (chips[0]) show(chips[0]);
})();
</script>
