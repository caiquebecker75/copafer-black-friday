  { z: 'fora', pr: 3, f: 'inflavel', n: 'Inflável', m: 'Biruta (sky dancer) de estoque, ou inflável personalizado com o KV.', q: '1 a 2', t: '1–3 dias úteis (estoque) · 10–15 (personalizado)' },

  { z: 'teto', pr: 1, f: 'portico-de-entrada', n: 'Pórtico de entrada', m: 'Treliça Q30 locada com lona ou tecido sublimado. Ref. 4 × 3 m.', q: '1 por entrada de clientes', t: '3–5 dias úteis' },
  { z: 'teto', pr: 1, f: 'banner-aereo-de-departamento', n: 'Banner aéreo de departamento', m: 'Lona dupla face blackout com bastão e cabo de aço, “Black Friday em [departamento]”. Ref. 3 × 1,5 m.', q: '1 por departamento + corredores centrais', t: '2–3 dias úteis' },

  { z: 'teto', pr: 2, f: 'adesivo-de-carrinho', n: 'Adesivo de carrinho', m: 'Vinil na placa frontal ou faixa na grade. Ref. 30 × 20 cm.', q: '1 por carrinho', t: '2–3 dias úteis' },
  { z: 'teto', pr: 2, f: 'envelopamento-de-pilares', n: 'Envelopamento de pilares', m: 'Lona com velcro ou adesivo removível. Ref. 2,5 m de altura.', q: '1 por pilar da circulação principal', t: '2–4 dias úteis + instalação' },
  { z: 'teto', pr: 2, f: 'bandeirolas', n: 'Bandeirolas', m: 'Varal em couché 150 g ou PS 0,5 mm. Ref. 20 × 30 cm.', q: 'Metragem dos corredores principais', t: '3–5 dias úteis' },
  { z: 'teto', pr: 2, f: 'roll-up', n: 'Roll-up', m: 'Lona ou poliéster nas bases retráteis que a loja já tem. Ref. 0,85 × 2 m.', q: '4 a 6', t: '1–3 dias úteis' },
  { z: 'teto', pr: 2, f: 'capa-de-placa-de-corredor', n: 'Capa de placa de corredor', m: 'Adesivo removível ou testeira em PS sobre a placa atual, mantendo o número.', q: '1 por placa de corredor', t: '2–3 dias úteis' },
  { z: 'teto', pr: 2, f: 'adesivo-de-piso-de-boas-vindas', n: 'Adesivo de piso de boas-vindas', m: 'Vinil com laminação antiderrapante no hall. Ref. 1,5 × 1,5 m.', q: '1 por entrada de clientes', t: '2–4 dias úteis' },
  { z: 'teto', pr: 3, f: 'adesivo-de-piso-direcional', n: 'Adesivo de piso direcional', m: 'Vinil antiderrapante, fora da rota de empilhadeira. Ref. 60 cm.', q: '1 a cada 10 m de corredor', t: '2–4 dias úteis' },

  { z: 'gondola', pr: 1, f: 'modelos-editaveis-de-cartaz', n: 'Modelos editáveis de cartaz', m: 'Arquivos de A6 a A3 para a impressora da loja, com campos de produto, preço e condição.', q: '1 kit (entrega digital)', t: '2 dias úteis, sem gráfica' },
  { z: 'gondola', pr: 1, f: 'cartaz-com-preco-em-branco', n: 'Cartaz com preço em branco', m: 'Couché 150 g com o KV impresso e campo de preço para preencher. A4, A3 e A2.', q: 'Ofertas + 30% de reposição', t: '2–3 dias úteis' },
  { z: 'gondola', pr: 1, f: 'testeira-de-ponta-de-gondola', n: 'Testeira de ponta de gôndola', m: 'PS 1–2 mm ou adesivo sobre a testeira existente. Ref. 1 × 0,3 m.', q: '1 por ponta de gôndola', t: '2–4 dias úteis' },
  { z: 'gondola', pr: 1, f: 'saia-de-pallet', n: 'Saia de pallet', m: 'Polionda ou papelão, 4 faces para pallet PBR. Ref. 30 cm de altura.', q: '1 por pallet ou ilha promocional', t: '3–5 dias úteis' },
  { z: 'gondola', pr: 1, f: 'faixa-de-gondola', n: 'Faixa de gôndola', m: 'PS 0,3 mm ou couché laminado, encaixado na canaleta de preço.', q: 'Metragem das gôndolas com oferta', t: '2–4 dias úteis' },
  { z: 'gondola', pr: 1, f: 'stopper', n: 'Stopper', m: 'PS 1 mm perpendicular à prateleira. Ref. 20 × 15 cm.', q: '1 a cada 3–5 m de gôndola', t: '3–5 dias úteis' },
  { z: 'gondola', pr: 1, f: 'wobbler', n: 'Wobbler', m: 'PS 0,5 mm com haste flexível e adesivo. Ref. 10 cm.', q: '1 por produto em destaque', t: '3–5 dias úteis' },
  { z: 'gondola', pr: 1, f: 'splash-adesivo', n: 'Splash adesivo', m: 'Adesivo em rolo com o selo Black Friday, para etiquetas e embalagens. Ref. 5 cm.', q: '2 por produto em oferta', t: '2–3 dias úteis' },
  { z: 'gondola', pr: 2, f: 'lateral-de-ponta-de-gondola', n: 'Lateral de ponta de gôndola', m: 'Adesivo removível nas laterais das pontas. Ref. 0,4 × 1,8 m.', q: '2 por ponta de gôndola', t: '2–3 dias úteis' },
  { z: 'gondola', pr: 2, f: 'display-de-mesa', n: 'Display de mesa', m: 'PS 2 mm ou acrílico com base, A4, nas áreas de pisos, louças e metais.', q: '1 por ambiente ou mesa de amostras', t: '2–4 dias úteis' },

  { z: 'caixa', pr: 1, f: 'adesivo-frontal-do-checkout', n: 'Adesivo frontal do checkout', m: 'Vinil laminado no lado do cliente da bancada. Ref. 1 × 0,8 m.', q: '1 por checkout', t: '2–3 dias úteis' },
  { z: 'caixa', pr: 1, f: 'capa-do-numero-de-caixa', n: 'Capa do número de caixa', m: 'Adesivo ou PS sobre a placa atual, mantendo o número visível.', q: '1 por checkout', t: '2–3 dias úteis' },
  { z: 'caixa', pr: 1, f: 'botton-da-equipe', n: 'Botton da equipe', m: 'Botton de 5,5 cm com alfinete, no uniforme de quem atende.', q: '1 por colaborador + 10%', t: '3–5 dias úteis' },
  { z: 'caixa', pr: 1, f: 'video-para-tvs', n: 'Vídeo para TVs e monitores', m: 'Loops de 15 e 30 s, em 16:9 e 9:16. Entra no ar antes das peças impressas.', q: '1 conjunto por loja', t: '2–3 dias úteis de edição' },
  { z: 'caixa', pr: 1, f: 'painel-de-led', n: 'Painel de LED da fachada', m: 'Vídeo ou estático na resolução do painel, se a loja tiver um.', q: '1 conjunto por loja', t: '2–3 dias úteis' },
  { z: 'caixa', pr: 2, f: 'display-de-balcao', n: 'Display de balcão', m: 'PS A5 ou A4 com os serviços da loja e o QR code do grupo VIP de WhatsApp.', q: '1 por checkout e balcão', t: '2–4 dias úteis' },
  { z: 'caixa', pr: 2, f: 'sinalizacao-do-balcao-de-retirada', n: 'Sinalização do balcão de retirada', m: 'Lona ou PS com o KV e a mensagem de retirada, medida no local.', q: '1 kit por balcão', t: '2–3 dias úteis' },
  { z: 'caixa', pr: 2, au: 1, f: 'spot-de-radio-interna', n: 'Spot de rádio interna', m: 'Locução institucional de 30 s, repetida a cada 15 minutos.', q: '1 a 2 versões', t: '3–5 dias úteis' },
  { z: 'caixa', pr: 3, f: 'adesivo-de-piso-da-fila', n: 'Adesivo de piso da fila', m: 'Vinil antiderrapante na fila do checkout. Ref. 40 cm.', q: '1 por fila', t: '2–4 dias úteis' },
  { z: 'caixa', pr: 3, f: 'divisor-de-esteira', n: 'Divisor de esteira', m: 'Adesivo sobre o divisor existente, ou divisor novo em PS impresso.', q: '2 por checkout com esteira', t: '3–5 dias úteis' },
  { z: 'caixa', pr: 3, f: 'camiseta-da-campanha', n: 'Camiseta da campanha', m: 'Malha com estampa DTF ou silk. Só entra se aprovada até 20/10.', q: '1 por colaborador', t: '5–10 dias úteis' }
];

(function () {
  var doc = document, html = doc.documentElement;
  var S = [].slice.call(doc.querySelectorAll('.s'));
  var cNow = doc.getElementById('cNow'), cAll = doc.getElementById('cAll');
  var segs = doc.getElementById('segs'), prevS = doc.getElementById('prevS'), nextS = doc.getElementById('nextS');
  var wipe = doc.getElementById('wipe'), live = doc.getElementById('live');
  var cur = 0, busy = false, isDeck = false, DUR = 850;
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // modo apresentação (uma tela por vez) em telas largas; no celular, rolagem vertical
  var deckMQ = matchMedia('(min-width: 900px) and (min-height: 560px)');
  cAll.textContent = pad(S.length);

  // barra de progresso clicável
  S.forEach(function (s, i) {
    var li = doc.createElement('li'), b = doc.createElement('button');
    b.type = 'button';
    b.title = pad(i + 1) + ' · ' + s.dataset.title;
    b.setAttribute('aria-label', b.title);
    b.innerHTML = '<i></i>';
    b.addEventListener('click', function () { go(i); });
    li.appendChild(b);
    segs.appendChild(li);
  });
  var segBtns = [].slice.call(segs.querySelectorAll('button'));

  function setActive(i) {
    cur = i;
    doc.body.dataset.tone = S[i].dataset.tone || 'red';
    cNow.textContent = pad(i + 1);
    segBtns.forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    prevS.disabled = i === 0;
    nextS.disabled = i === S.length - 1;
    if (history.replaceState) history.replaceState(null, '', '#s' + (i + 1));
  }
  function reveal(s, delay) {
    s.classList.remove('in');
    void s.offsetWidth;
    setTimeout(function () { s.classList.add('in'); }, delay);
  }
  // troca de tela: a próxima entra num recorte que corre pela tela, com a faixa amarela na borda
  function show(i) {
    if (i === cur || busy) return;
    var from = S[cur], to = S[i], fwd = i > cur;
    to.scrollTop = 0;
    if (!reduce) {
      busy = true;
      from.classList.add('leaving', fwd ? 'to-l' : 'to-r');
      to.classList.add(fwd ? 'from-r' : 'from-l');
      wipe.className = 'wipe';
      void wipe.offsetWidth;
      wipe.className = 'wipe ' + (fwd ? 'run-l' : 'run-r');
      setTimeout(function () {
        from.classList.remove('leaving', 'to-l', 'to-r');
        to.classList.remove('from-r', 'from-l');
        wipe.className = 'wipe';
        busy = false;
      }, DUR);
    }
    from.classList.remove('on');
    to.classList.add('on');
    reveal(to, reduce ? 0 : 280);
    setActive(i);
    live.textContent = 'Tela ' + (i + 1) + ' de ' + S.length + ': ' + to.dataset.title;
  }
  function go(i) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (isDeck) show(i);
    else S[i].scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }
  function enterDeck() {
    isDeck = true;
    html.classList.add('deck');
    S.forEach(function (s, j) {
      s.classList.remove('leaving', 'to-l', 'to-r', 'from-r', 'from-l');
      s.classList.toggle('on', j === cur);
      s.classList.add('in');
    });
    window.scrollTo(0, 0);
    setActive(cur);
  }
  function exitDeck() {
    isDeck = false;
    busy = false;
    html.classList.remove('deck');
    wipe.className = 'wipe';
    S.forEach(function (s) { s.classList.remove('on', 'leaving', 'to-l', 'to-r', 'from-r', 'from-l'); s.classList.add('in'); });
    S[cur].scrollIntoView();
  }

  // rolagem (celular): tela ativa = a que cruza o meio da janela
  if ('IntersectionObserver' in window) {
    var mid = new IntersectionObserver(function (es) {
      if (isDeck) return;
      es.forEach(function (e) { if (e.isIntersecting) setActive(S.indexOf(e.target)); });
    }, { rootMargin: '-50% 0px -50% 0px', threshold: 0 });
    var rev = new IntersectionObserver(function (es) {
      if (isDeck) return;
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); rev.unobserve(e.target); } });
    }, { threshold: 0.12 });
    S.forEach(function (s) { mid.observe(s); rev.observe(s); });
  }

  // início (aceita link direto #s3)
  var m = location.hash.match(/^#s(\d+)$/);
  if (m && S[+m[1] - 1]) cur = +m[1] - 1;
  if (deckMQ.matches) { enterDeck(); reveal(S[cur], 120); }
  else { setActive(cur); if (cur) setTimeout(function () { S[cur].scrollIntoView(); }, 60); }
  var onMode = function () { if (deckMQ.matches && !isDeck) enterDeck(); else if (!deckMQ.matches && isDeck) exitDeck(); };
  if (deckMQ.addEventListener) deckMQ.addEventListener('change', onMode); else deckMQ.addListener(onMode);

  prevS.addEventListener('click', function () { go(cur - 1); });
  nextS.addEventListener('click', function () { go(cur + 1); });
  doc.querySelector('.brand').addEventListener('click', function (e) { e.preventDefault(); go(0); });

  // toque (tablet em modo apresentação): deslizar para os lados troca de tela, menos no carrossel do kit
  var tx = null, ty = 0;
  doc.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || (!lbOpen && (!isDeck || e.target.closest('.rail')))) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  doc.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (lbOpen) lbShow(lbI + (dx < 0 ? 1 : -1)); else go(cur + (dx < 0 ? 1 : -1));
    }
    tx = null;
  }, { passive: true });

  // ---------- kit ----------
  var tabs = doc.getElementById('tabs'), rail = doc.getElementById('rail');
  var prevC = doc.getElementById('prevC'), nextC = doc.getElementById('nextC');
  var PR = { 1: ['p1', 'Essencial'], 2: ['p2', 'Recomendada'], 3: ['p3', 'Opcional'] };
  var ZN = {};
  ZONES.forEach(function (z) { ZN[z.id] = z.name; });
  // imagens presentes em assets/pdv/ (o build.ps1 preenche esta lista: nome sem extensão -> arquivo)
  var PDV = /*@@PDV@@*/{};
  KIT.forEach(function (k, i) { k.file = pad(i + 1) + '-' + k.f; });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function loadImg(ph, base, n) {
    if (!PDV[base]) return;
    var im = new Image();
    im.alt = n;
    im.loading = 'lazy';
    im.onload = function () { ph.classList.add('has-img'); };
    im.src = 'assets/pdv/' + PDV[base];
    ph.appendChild(im);
  }
  function card(k) {
    var p = PR[k.pr], has = !!PDV[k.file];
    var el = doc.createElement('article');
    el.className = 'card';
    var empty = k.au
      ? '<div class="ph-empty"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/></svg>Peça de áudio · 30 s</div>'
      : '<div class="ph-empty"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>Imagem do material</div>';
    el.innerHTML =
      (has
        ? '<button type="button" class="ph zoom" aria-label="Ampliar imagem: ' + esc(k.n) + '"><span class="pr ' + p[0] + '">' + p[1] + '</span>' + empty +
          '<span class="zoom-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4M11 8v6M8 11h6"/></svg></span></button>'
        : '<div class="ph' + (k.au ? ' audio' : '') + '"><span class="pr ' + p[0] + '">' + p[1] + '</span>' + empty + '</div>') +
      '<div class="bd"><p class="zn">' + esc(ZN[k.z]) + '</p><h3>' + esc(k.n) + '</h3><p class="m">' + esc(k.m) + '</p>' +
      '<dl><dt>Qtd.</dt><dd>' + esc(k.q) + '</dd><dt>Prazo</dt><dd>' + esc(k.t) + '</dd></dl></div>';
    loadImg(el.querySelector('.ph'), k.file, k.n);
    if (has) el.querySelector('.ph').addEventListener('click', function () { openLb(k); });
    return el;
  }
  var railWrap = doc.getElementById('railWrap');
  function arrows() {
    prevC.disabled = rail.scrollLeft <= 4;
    nextC.disabled = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 4;
    railWrap.classList.toggle('end', nextC.disabled);
  }
  // filtros: primeiro por prioridade (P1, P2, P3), depois por área da loja
  var FILTERS = [
    { f: 'p1', name: 'P1 · Essencial', dot: 'd1', test: function (k) { return k.pr === 1; } },
    { f: 'p2', name: 'P2 · Recomendada', dot: 'd2', test: function (k) { return k.pr === 2; } },
    { f: 'p3', name: 'P3 · Opcional', dot: 'd3', test: function (k) { return k.pr === 3; } }
  ].concat(ZONES.map(function (z) { return { f: z.id, name: z.name, test: function (k) { return k.z === z.id; } }; }));
  // ---------- imagem ampliada (navega pelas peças do filtro atual) ----------
  var shown = [];
  var lbx = doc.getElementById('lbx'), lbxImg = doc.getElementById('lbxImg'), lbxZn = doc.getElementById('lbxZn'),
      lbxNm = doc.getElementById('lbxNm'), lbxQt = doc.getElementById('lbxQt'), lbxCount = doc.getElementById('lbxCount'),
      lbxClose = doc.getElementById('lbxClose'), lbxPrev = doc.getElementById('lbxPrev'), lbxNext = doc.getElementById('lbxNext');
  var lbList = [], lbI = 0, lbLast = null;
  var lbOpen = false;
  lbxImg.addEventListener('load', function () {
    var narrow = innerWidth <= 700, w = lbxImg.naturalWidth, h = lbxImg.naturalHeight;
    var s = Math.min((innerWidth - (narrow ? 24 : 200)) / w, (innerHeight - (narrow ? 260 : 220)) / h, 1.8);
    lbxImg.style.width = Math.round(w * s) + 'px';
    lbxImg.style.height = Math.round(h * s) + 'px';
  });
  function lbShow(i) {
    lbI = (i + lbList.length) % lbList.length;
    var k = lbList[lbI];
    lbxImg.style.width = lbxImg.style.height = '';
    lbxImg.src = 'assets/pdv/' + PDV[k.file];
    lbxImg.alt = k.n;
    lbxZn.textContent = ZN[k.z] + ' · ' + PR[k.pr][1];
    lbxNm.textContent = k.n;
    lbxQt.textContent = k.q + ' · ' + k.t;
    lbxCount.textContent = (lbI + 1) + ' / ' + lbList.length;
  }
  function openLb(k) {
    lbList = shown.filter(function (x) { return PDV[x.file]; });
    lbLast = doc.activeElement;
    lbx.classList.toggle('single', lbList.length < 2);
    lbShow(Math.max(0, lbList.indexOf(k)));
    lbOpen = true;
    lbx.classList.add('open');
    lbx.setAttribute('aria-hidden', 'false');
    html.style.overflow = 'hidden';
    lbxClose.focus();
  }
  function closeLb() {
    lbOpen = false;
    lbx.classList.remove('open');
    lbx.setAttribute('aria-hidden', 'true');
    html.style.overflow = '';
    if (lbLast && lbLast.focus) lbLast.focus();
  }
  lbxClose.addEventListener('click', closeLb);
  lbxPrev.addEventListener('click', function () { lbShow(lbI - 1); });
  lbxNext.addEventListener('click', function () { lbShow(lbI + 1); });
  lbx.addEventListener('click', function (e) { if (e.target === lbx || e.target.classList.contains('lbx-stage')) closeLb(); });

  function showFilter(f) {
    var flt = FILTERS.filter(function (x) { return x.f === f; })[0];
    [].forEach.call(tabs.querySelectorAll('button'), function (b) { b.setAttribute('aria-selected', b.dataset.f === f ? 'true' : 'false'); });
    rail.innerHTML = '';
    shown = KIT.filter(flt.test);
    shown.forEach(function (k) { rail.appendChild(card(k)); });
    rail.scrollLeft = 0;
    rail.setAttribute('aria-label', flt.name);
    arrows();
  }
  FILTERS.forEach(function (x, i) {
    if (i === 3) { var sep = doc.createElement('span'); sep.className = 'sep'; sep.setAttribute('aria-hidden', 'true'); tabs.appendChild(sep); }
    var b = doc.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.dataset.f = x.f;
    b.innerHTML = (x.dot ? '<i class="dot ' + x.dot + '" aria-hidden="true"></i>' : '') + esc(x.name) + '<span>' + KIT.filter(x.test).length + '</span>';
    b.addEventListener('click', function () { showFilter(x.f); });
    tabs.appendChild(b);
  });
  var step = function () { var c = rail.querySelector('.card'); return c ? (c.offsetWidth + 20) * 2 : 600; };
  prevC.addEventListener('click', function () { rail.scrollBy({ left: -step(), behavior: reduce ? 'auto' : 'smooth' }); });
  nextC.addEventListener('click', function () { rail.scrollBy({ left: step(), behavior: reduce ? 'auto' : 'smooth' }); });
  rail.addEventListener('scroll', arrows, { passive: true });
  addEventListener('resize', arrows);
  showFilter('p1');

  // ---------- teclado: → ↓ PageDown espaço avançam · ← ↑ PageUp voltam · Home/End ----------
  addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, onCtl = e.target && e.target.closest && e.target.closest('button, a');
    if (lbOpen) {
      if (k === 'Escape') { e.preventDefault(); closeLb(); }
      else if (k === 'ArrowRight' || k === 'ArrowDown') { e.preventDefault(); lbShow(lbI + 1); }
      else if (k === 'ArrowLeft' || k === 'ArrowUp') { e.preventDefault(); lbShow(lbI - 1); }
      else if (k === 'Tab') { e.preventDefault(); var f = [lbxClose, lbxPrev, lbxNext].filter(function (b) { return b.offsetParent; }); var j = f.indexOf(doc.activeElement); f[(j + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
      return;
    }
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey && !onCtl)) { e.preventDefault(); go(cur + 1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey && !onCtl)) { e.preventDefault(); go(cur - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(S.length - 1); }
  });
})();
