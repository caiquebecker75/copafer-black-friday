<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#173e66;--cyan:#27a2df;--ink:#0d2a4a}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Nunito,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:url(bg.jpg) center/cover}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,45,77,.35),rgba(15,45,77,.75))}
.wrap{position:absolute;inset:0;padding:64px 80px}
header{display:flex;justify-content:space-between;align-items:flex-start}
h1{margin:0;font-size:58px;font-weight:900;letter-spacing:1px;line-height:1}
h1 span{color:var(--cyan);font-weight:300}
.sub{margin-top:12px;font-size:22px;color:#a9cdee;font-weight:400}
header img{height:120px}
.phases{position:absolute;left:80px;right:80px;top:255px;display:grid;grid-template-columns:repeat(8,1fr);gap:16px}
.ph{grid-column:span var(--n);border-top:3px solid var(--c);padding-top:10px;font-size:16px;letter-spacing:5px;font-weight:800;text-transform:uppercase;color:var(--c)}
.line{position:absolute;left:80px;right:80px;top:352px;height:4px;background:linear-gradient(90deg,#27a2df,#7cc6ee 70%,#fff 76%,#27a2df)}
.cols{position:absolute;left:80px;right:80px;top:322px;display:grid;grid-template-columns:repeat(8,1fr);gap:16px}
.m{display:flex;flex-direction:column;align-items:center}
.dot{width:64px;height:64px;border-radius:50%;background:var(--navy);border:4px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;box-shadow:0 0 0 8px rgba(39,162,223,.15)}
.m.d .dot{background:#fff;color:var(--navy);border-color:#fff;width:76px;height:76px;margin-top:-6px;font-size:18px;box-shadow:0 0 0 10px rgba(255,255,255,.18)}
.card{margin-top:22px;width:100%;height:530px;display:flex;flex-direction:column;background:rgba(9,32,58,.62);border:1px solid rgba(124,198,238,.28);border-radius:14px;padding:20px 18px;backdrop-filter:blur(2px)}
.m.d .card{background:rgba(255,255,255,.96);color:var(--ink);border-color:#fff}
.card h3{margin:0 0 10px;font-size:22px;font-weight:900;line-height:1.1}
.m.d .card h3{color:var(--navy)}
.card ul{margin:0;padding:0 0 0 18px;font-size:16.5px;line-height:1.38;color:#dbe9f6}
.m.d .card ul{color:#2b4a68}
.card li{margin-bottom:6px}
.card li::marker{color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:13px;font-weight:800;letter-spacing:1px;padding:4px 9px;border-radius:20px;background:rgba(39,162,223,.2);color:#9fd6f5;border:1px solid rgba(39,162,223,.5);text-transform:uppercase}
.m.d .chip{background:#e3f2fb;color:#1b6aa0;border-color:#9fd0ee}
.obj{margin-top:auto;padding-top:12px;border-top:1px solid rgba(124,198,238,.3);font-size:14.5px;line-height:1.3;color:#9fd6f5}.obj b{display:block;font-size:12px;letter-spacing:3px;color:#7cc6ee;margin-bottom:3px}.m.d .obj{color:#1b6aa0;border-color:#cfe6f5}.m.d .obj b{color:#27a2df}
footer{position:absolute;left:80px;right:80px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-size:17px;color:#a9cdee}
footer b{color:#fff}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
 <header>
  <div><h1>RÉGUA DE <span>COMUNICAÇÃO</span></h1>
   <div class="sub">Da primeira chamada ao pós-evento · ~380 participantes · evento interno</div></div>
  <img src="logo_2027.png">
 </header>
</div>
<div class="phases">
 <div class="ph" style="--n:2;--c:#7cc6ee">Aquecimento</div>
 <div class="ph" style="--n:3;--c:#27a2df">Confirmação &amp; logística</div>
 <div class="ph" style="--n:2;--c:#ffffff">Evento</div>
 <div class="ph" style="--n:1;--c:#7cc6ee">Pós</div>
</div>
<div class="line"></div>
<div class="cols" id="cols"></div>
<footer><div><b>Mensagem-guia:</b> Shaping Competitiveness, Evolving To Win</div><div>Datas relativas ao dia do evento (D)</div></footer>
<script>
const O=['Gerar expectativa e garantir a data na agenda','Apresentar o tema e abrir as inscrições','Meta de 100% da base com resposta','Zero dúvida sobre deslocamento e hospedagem','Chegada tranquila e credenciamento ágil','Presença confirmada e expectativa alta','Viver o conceito na prática','Prolongar a reflexão e medir a experiência'];
const M=[
 ['D-60','Save the date',['E-mail com KV e data do evento','Bloqueio de agenda (.ics)','Aviso prévio via WhatsApp'],['E-mail','WhatsApp']],
 ['D-45','Convite oficial',['Convite digital personalizado','Abertura do RSVP no hotsite','Agenda preliminar e tema'],['E-mail','Hotsite']],
 ['D-30','Lembrete RSVP',['Lembrete para quem não respondeu','Contato ativo da equipe de RSVP','Encerramento das inscrições'],['E-mail','WhatsApp','Telefone']],
 ['D-15','Confirmação + logística',['Confirmação de presença','Hotel Blue Tree, transfer e voos','Teaser do conceito via WhatsApp'],['E-mail','WhatsApp']],
 ['D-7','Guia do participante',['Agenda final e palestrantes','Como chegar, dress code e contatos','QR Code individual do credenciamento'],['E-mail','Hotsite']],
 ['D-1','Lembrete final',['"Te esperamos amanhã"','Horário do credenciamento','Contagem regressiva via WhatsApp'],['WhatsApp']],
 ['DIA D','Experiência no local',['Credenciamento com QR Code','Sinalização, telão e espaço para fotos','Fotos do dia enviadas via WhatsApp'],['Presencial','WhatsApp']],
 ['D+1 / D+7','Pós-evento',['Agradecimento + pesquisa de satisfação','Galeria de fotos do evento','Card de reflexão com o insight-chave do dia'],['E-mail','WhatsApp']],
];
document.getElementById('cols').innerHTML=M.map((m,i)=>`<div class="m ${m[0]=='DIA D'?'d':''}"><div class="dot">${m[0].replace(' / ','<br>')}</div><div class="card"><h3>${m[1]}</h3><ul>${m[2].map(x=>`<li>${x}</li>`).join('')}</ul><div class="chips">${m[3].map(c=>`<span class="chip">${c}</span>`).join('')}</div><div class="obj"><b>OBJETIVO</b>${O[i]}</div></div></div>`).join('');
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r))]).then(()=>document.body.dataset.ready=1);
</script></body></html>
