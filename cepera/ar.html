<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Veja no seu espaço · 75LAB × Cepêra</title>
<meta name="theme-color" content="#140b06">
<link rel="icon" href="assets/brand/favicon.png">
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root{--bg:#140b06;--y:#ffd21f;--g:#3d1f0c;--c:#fffdf4;--m:rgba(255,253,244,.66)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--c);font-family:'Outfit',system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:12px}
  header img{height:28px;width:auto}
  h1{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;text-transform:uppercase;font-size:34px;line-height:.9;padding:4px 16px 0}
  h1 em{font-style:normal;color:var(--y)}
  p.note{font-size:13px;color:var(--m);padding:8px 16px 0;line-height:1.4}
  model-viewer{flex:1;width:100%;min-height:60vh;background:radial-gradient(80% 70% at 50% 40%,#3a2312,#140b06)}
  .tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
  .tabs a{flex:none;padding:10px 14px;border-radius:99px;border:1px solid rgba(254,245,168,.2);color:var(--m);text-decoration:none;font-size:14px}
  .tabs a.on{background:var(--y);color:var(--g);border-color:var(--y);font-weight:600}
  .arb{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:15px 22px;border-radius:99px;background:var(--y);color:var(--g);font-weight:700;font-size:16px;border:0;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap}
  .tag{display:inline-block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);border:1px solid var(--y);border-radius:99px;padding:4px 9px}
  footer{padding:12px 16px 20px;font-size:12px;color:var(--m)}
  footer a{color:var(--c)}
</style>
<script type="module" src="vendor/model-viewer.min.js"></script>
</head>
<body>
<header>
  <img src="assets/brand/cep-logo.png" alt="Cepêra">
  <span class="tag">Volumetria conceitual</span>
  <img src="assets/brand/75lab-lime.png" alt="75 LAB">
</header>
<h1>Veja no <em>seu espaço</em></h1>
<p class="note" id="desc"></p>
<nav class="tabs" aria-label="Configurações">
  <a href="?m=a" data-m="a">A · Experiência</a><a href="?m=b" data-m="b">B · Presença</a><a href="?m=c" data-m="c">C · Essencial</a>
</nav>
<model-viewer id="mv" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1.1" exposure="1.05" environment-image="neutral"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" camera-orbit="28deg 76deg auto">
  <button slot="ar-button" class="arb">▣ Ver no seu espaço</button>
</model-viewer>
<footer>Modelo para discussão: medidas, materiais, carga e estabilidade dependem de levantamento e protótipo. Se o aparelho não suportar AR, gire e aproxime o modelo em 3D. · <a href="./">voltar à apresentação</a></footer>
<script>
  const M={a:['assets/models/modulo-a-experiencia.glb','Configuração A · módulo de chão (≈ 72 × 46 × 186 cm) com testeira, cartela de ocasião e régua.'],
           b:['assets/models/modulo-b-presenca.glb','Configuração B · expositor compacto (≈ 50 × 34 × 142 cm) para lojas com espaço intermediário.'],
           c:['assets/models/modulo-c-essencial.glb','Configuração C · kit de gôndola com régua, porta-preço, cartela e stopper.']};
  const k=(new URLSearchParams(location.search).get('m')||'a').toLowerCase(); const m=M[k]||M.a;
  const mv=document.getElementById('mv'); mv.src=m[0]; mv.alt=m[1]; document.getElementById('desc').textContent=m[1];
  document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.m===(M[k]?k:'a')));
</script>
</body>
</html>
